ильный вариант ответа.", "o": ["В течение трех рабочих дней.", "В течение одного рабочего дня.", "В течение семи рабочих дней.", "В течение пяти рабочих дней."], "c": [1], "multi": false}, {"q": "Какие требования законодательства Российской Федерации к эксплуатации зданий, сооружений указаны неверно? Выберите правильный вариант ответа.", "o": ["Эксплуатация зданий, сооружений должна осуществляться в соответствии с их разрешенным использованием (назначением).", "В случае, если для строительства, реконструкции объектов капитального строительства не требуется выдача разрешения на строительство, эксплуатация таких объектов допускается на этапе завершения строительства, реконструкции.", "Все перечисленные требования указаны верно.", "В случае капитального ремонта зданий, сооружений эксплуатация таких зданий, сооружений допускается после окончания их капитального ремонта.", "Эксплуатация построенного, реконструированного здания, сооружения допускается после получения застройщиком акта, разрешающего эксплуатацию здания, сооружения, в случаях, предусмотренных федеральными законами."], "c": [1], "multi": false}, {"q": "В каком случае экспертиза проектной документации по решению застройщика может не проводиться в отношении изменений, внесенных в проектную документацию, получившую положительное заключение экспертизы проектной документации? Выберите правильный вариант ответа.", "o": ["Если такие изменения одновременно не влекут за собой изменение класса, категории и (или) первоначально установленных показателей функционирования линейных объектов.", "Если такие изменения одновременно соответствуют заданию застройщика или технического заказчика на проектирование, а также результатам инженерных изысканий.", "Во всех перечисленных случаях.", "Если такие изменения одновременно не затрагивают несущие строительные конструкции объекта капитального строительства, за исключением замены отдельных элементов таких конструкций на аналогичные или иные улучшающие показатели таких конструкций элементы."], "c": [2], "multi": false}, {"q": "Какие события из числа перечисленных относятся к понятию \"авария на опасном объекте\"? Выберите правильный вариант ответа.", "o": ["Отказ или повреждение технических устройств.", "Повреждение или разрушение сооружений, технических устройств, применяемых на опасном объекте.", "Все перечисленные.", "Отклонение от режима технологического процесса."], "c": [2], "multi": false}, {"q": "Какое из перечисленных требований к обязательной сертификации указано верно? Выберите 2 варианта ответа.", "o": ["Схемы сертификации, применяемые для сертификации определенных видов продукции, устанавливаются соответствующим техническим регламентом.", "Обязательная сертификация осуществляется органом по сертификации на основании договора с заявителем.", "Срок действия сертификата соответствия определяется органом по сертификации.", "Сертификат соответствия выдается только на серийно выпускаемую продукцию."], "c": [0, 1], "multi": true}, {"q": "По какой из перечисленных схем может осуществляться декларирование соответствия? Выберите правильный вариант ответа.", "o": ["Принятие декларации о соответствии на основании собственных доказательств, доказательств, полученных с участием аккредитованной испытательной лаборатории (центра).", "Принятие декларации о соответствии на основании собственных доказательств, доказательств, полученных с участием органа по сертификации.", "Принятие декларации о соответствии на основании собственных доказательств.", "По любой из перечисленных."], "c": [3], "multi": false}, {"q": "Каким образом определяется срок действия декларации о соответствии? Выберите правильный вариант ответа.", "o": ["Ростехнадзором.", "Федеральным законом от 27.12.2002 N 184-ФЗ \"О техническом регулировании\".", "Росстандартом.", "Техническим регламентом."], "c": [3], "multi": false}, {"q": "В течение какого срока осуществляется регистрация системы добровольной сертификации с момента предоставления документов для регистрации системы добровольн их, горючих, взрывчатых, токсичных, высокотоксичных веществ и веществ, представляющих опасность для окружающей среды, на взрывопожароопасных и химически опасных производственных объектах I, II или III классов опасности.", "Использование (эксплуатация) на объектах оборудования, работающего под избыточным давлением более 0,07 МПа воды при температуре нагрева более 115 °C и иных жидкостей при температуре, превышающей температуру их кипения при избыточном давлении 0,07 МПа.", "Получение расплавов черных и цветных металлов, сплавов на основе этих расплавов с применением оборудования, рассчитанного на максимальное количество расплава, составляющее 500 кг и более.", "Работы, связанные с получением, использованием, переработкой, хранением, транспортированием и уничтожением взрывчатых материалов промышленного назначения."], "c": [3], "multi": false}, {"q": "Каким документом устанавливается порядок проведения технического расследования причин аварий на опасных производственных объектах? Выберите правильный вариант ответа.", "o": ["Нормативным документом, утвержденным федеральным органом исполнительной власти в области промышленной безопасности.", "Федеральным законом от 21.07.1997 № 116-ФЗ «О промышленной безопасности опасных производственных объектов».", "Постановлением Правительства Российской Федерации.", "Трудовым кодексом Российской Федерации."], "c": [0], "multi": false}, {"q": "Какой нормативный правовой акт устанавливает критерии классификации опасных производственных объектов? Выберите правильный вариант ответа.", "o": ["Федеральный закон.", "Постановление Правительства Российской Федерации.", "Нормативный правовой акт Ростехнадзора.", "Нормативный правовой акт МЧС России."], "c": [0], "multi": false}, {"q": "В каком случае иные федеральные органы исполнительной власти помимо Федеральной службы по экологическому, технологическому и атомному надзору, могут быть уполномочены осуществлять специальные разрешительные, контрольные и надзорные функции в области промышленной const KEY = 'ps_trainer_v1';
const CYCLE = 20, EXAM_MIN = 20, EXAM_MAX_ERR = 2;

/* ---------- данные ---------- */
function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return 'q'+(h>>>0).toString(36)}
const Q = RAW.map(r=>({id:hash(r.q),q:r.q,o:r.o,c:r.c,multi:r.multi}));
const BY = Object.fromEntries(Q.map(q=>[q.id,q]));
const CARD = Object.fromEntries(Q.map((q,i)=>[q.id,CARDS[i]]));

/* ---------- хранилище ---------- */
let S = load();
S.cards=S.cards||{};
function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.stats)return s}catch(e){}
  return {stats:{},cycles:0,history:[],shuffle:true,session:null,cards:{}};
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function st(id){return S.stats[id]||(S.stats[id]={seen:0,wrong:0,streak:0,last:null,lastCycle:0})}
function cst(id){return S.cards[id]||(S.cards[id]={box:0,n:0})}
function record(id,ok){
  if(!ok){cst(id).box=0}
  const s=st(id);s.seen++;if(!ok){s.wrong++;s.streak=0}else s.streak++;
  s.last=ok;s.lastCycle=S.cycles;
}

/* ---------- выбор вопросов ---------- */
function weight(q){
  const s=S.stats[q.id];if(!s||!s.seen)return 3;
  const a=(s.wrong+1)/(s.seen+2);                 // сглаженная доля ошибок
  let w=0.4+6*a;
  if(s.last===false)w*=1.8;                       // последний ответ неверный
  if(s.streak>=2)w*=Math.pow(0.6,Math.min(s.streak,5)-1); // уже запомнен
  w*=1+Math.min(S.cycles-s.lastCycle,10)*0.05;    // давно не видели
  return Math.max(w,0.05);
}
const BOXF=[3,2,1,.5,.2];
function cardWeight(q){const c=S.cards[q.id];const b=c?c.box:0;return weight(q)*BOXF[b]}
function pickCards(pool,n){
  pool=pool.slice();const out=[];
  while(out.length<n&&pool.length){
    const ws=pool.map(cardWeight);let r=Math.random()*ws.reduce((x,y)=>x+y,0),i=0;
    for(;i<pool.length-1;i++){r-=ws[i];if(r<=0)break}
    out.push(pool.splice(i,1)[0]);
  }
  return out;
}
function mastered(){return Q.filter(q=>S.cards[q.id]&&S.cards[q.id].box>=3).length}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function weightedPick(pool,n){
  pool=pool.slice();const out=[];
  while(out.length<n&&pool.length){
    const ws=pool.map(weight);let r=Math.random()*ws.reduce((x,y)=>x+y,0),i=0;
    for(;i<pool.length-1;i++){r-=ws[i];if(r<=0)break}
    out.push(pool.splice(i,1)[0]);
  }
  return out;
}
function unseenCount(){return Q.filter(q=>!(S.stats[q.id]&&S.stats[q.id].seen)).length}
function pickTraining(){
  const unseen=Q.filter(q=>!(S.stats[q.id]&&S.stats[q.id].seen));
  let pick=[];
  if(unseen.length){
    pick=shuffle(unseen).slice(0,CYCLE);
    if(pick.length<CYCLE){
      const ids=new Set(pick.map(q=>q.id));
      pick=pick.concat(weightedPick(Q.filter(q=>!ids.has(q.id)),CYCLE-pick.length));
    }
  }else pick=weightedPick(Q,CYCLE);
  return shuffle(pick);
}
function pickExam(){return shuffle(Q).slice(0,CYCLE)}

/* ---------- сессия ---------- */
function newItem(q){
  const order=q.o.map((_,i)=>i);
  return {id:q.id,order:S.shuffle?shuffle(order):order,sel:[],done:false,ok:null};
}
function startSession(mode){
  const qs=mode==='exam'?pickExam():pickTraining();
  S.session={mode,items:qs.map(newItem),idx:0,
    start:Date.now(),end:mode==='exam'?Date.now()+EXAM_MIN*60000:null,finished:false,
    phase:unseenCount()>0?'collect':'adaptive'};
  save();render();
}
const sess=()=>S.session;
function isOk(it){const q=BY[it.id];const sel=it.sel.map(i=>it.order[i]).sort((a,b)=>a-b);const c=q.c.slice().sort((a,b)=>a-b);return sel.length===c.length&&sel.every((v,i)=>v===c[i])}

function totals(){
  let seen=0,att=0,wr=0,mastered=0;
  for(const q of Q){const s=S.stats[q.id];if(s&&s.seen){seen++;att+=s.seen;wr+=s.wrong;if(s.streak>=3)mastered++}}
  return {seen,att,wr,mastered};
}

function renderQuiz(){
  const s=sess(),it=s.items[s.idx],q=BY[it.id],exam=s.mode==='exam';
  if(exam&&Date.now()>=s.end)return finish(true);
  const stt=S.stats[q.id];
  const answered=it.done;
  let optsHtml=it.order.map((oi,pos)=>{
    const picked=it.sel.includes(pos),right=q.c.includes(oi);
    let cls='opt'+(q.multi?' multi':'');
    if(!exam&&answered){cls+=' locked';if(right)cls+=' right';else if(picked)cls+=' wrong'}
    else if(picked)cls+=' sel';
    const mark=(!exam&&answered)?(right?'✓':(picked?'✗':'')):(picked?'✓':'');
    return `<button class="${cls}" data-pos="${pos}"><span class="mk">${mark}</span><span>${esc(q.o[oi])}</span></button>`;
  }).join('');
  let pal='';
  if(exam)pal='<div class="pal">'+s.items.map((x,i)=>`<button data-go="${i}" class="${x.sel.length?'ans':''} ${i===s.idx?'cur':''}">${i+1}</button>`).join('')+'</div>';
  let foot='';
  if(exam){
    foot=`<div class="row"><button id="prev" ${s.idx===0?'disabled':''}>← Назад</button>
      <button id="next" ${s.idx===s.items.length-1?'disabled':''}>Далее →</button>
      <button class="primary" id="fin" style="margin-left:auto">Завершить экзамен</button></div>`;
  }else{
    if(!answered)foot=q.multi?`<div class="row"><button class="primary" id="submit" ${it.sel.length?'':'disabled'}>Ответить</button></div>`:'';
    else{
      const last=s.idx===s.items.length-1;
      foot=`<div class="verdict ${it.ok?'ok':'bad'}">${it.ok?'Верно!':'Неверно'}</div>
      <div class="row"><button class="primary" id="nextq">${last?'Завершить цикл':'Далее →'}</button></div>`;
    }
  }
  const cd=CARD[q.id];
  const mem=(!exam&&answered&&cd)?`<div class="tip ${it.ok?'':'bad'}">💡 <b>${esc(cd.a)}</b><div class="small" style="margin-top:4px">${esc(cd.m)}</div></div>`:'';
  const info=!exam&&stt&&stt.seen?`<span class="muted small">Ранее: ${stt.seen-stt.wrong} верно, ${stt.wrong} неверно</span>`:(!exam?`<span class="muted small">Новый вопрос</span>`:'');
  app.innerHTML=`
  <div class="top"><div><b>${exam?'Экзамен':'Тренировка'}</b> · вопрос ${s.idx+1} из ${s.items.length}${s.phase==='collect'&&!exam?'<span class="badge">сбор статистики</span>':''}</div>
  ${exam?`<div class="timer" id="timer">${fmt(s.end-Date.now())}</div>`:''}</div>
  <div class="bar"><i style="width:${(s.idx+(answered?1:0))/s.items.length*100}%"></i></div>
  ${pal}
  <div class="card"><div class="q">${esc(q.q)}</div>${q.multi?'<div class="small muted" style="margin:-6px 0 8px">Несколько вариантов ответа</div>':''}
  ${optsHtml}${foot}${mem}<div style="margin-top:10px">${info}</div></div>
  <div class="row"><button id="home">В меню</button></div>`;

  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.pos));
  if($('#submit'))$('#submit').onclick=()=>answerTrain();
  if($('#nextq'))$('#nextq').onclick=nextTrain;
  if($('#prev'))$('#prev').onclick=()=>{s.idx--;save();renderQuiz()};
  if($('#next'))$('#next').onclick=()=>{s.idx++;save();renderQuiz()};
  app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{s.idx=+b.dataset.go;save();renderQuiz()});
  if($('#fin'))$('#fin').onclick=()=>{
    const un=s.items.filter(x=>!x.sel.length).length;
    ask(un?`Без ответа: ${un}. Они будут засчитаны как ошибки. Завершить?`:'Завершить экзамен?',()=>finish(false));
  };
  $('#home').onclick=()=>{view='home';render()};
  if(exam){
    timerId=setInterval(()=>{
      const left=s.end-Date.now();const el=$('#timer');
      if(left<=0){finish(true);return}
      if(el){el.textContent=fmt(left);el.classList.toggle('low',left<=120000)}
    },500);
    const el=$('#timer');if(el)el.classList.toggle('low',s.end-Date.now()<=120000);
  }
}
function pick(pos){
  const s=sess(),it=s.items[s.idx],q=BY[it.id],exam=s.mode==='exam';
  if(it.done)return;
  if(q.multi||exam){
    const k=it.sel.indexOf(pos);
    if(q.multi){if(k>=0)it.sel.splice(k,1);else it.sel.push(pos)}
    else it.sel=[pos];
    save();renderQuiz();
  }else{it.sel=[pos];answerTrain()}
}
function answerTrain(){
  const s=sess(),it=s.items[s.idx];
  if(it.done||!it.sel.length)return;
  it.done=true;it.ok=isOk(it);record(it.id,it.ok);save();renderQuiz();
}
function nextTrain(){
  const s=sess();
  if(s.idx<s.items.length-1){s.idx++;save();renderQuiz()}else finish(false);
}
function finish(timeout){
  const s=sess();if(s.finished)return;
  s.finished=true;s.timeout=!!timeout;s.spent=Math.min(Date.now(),s.end||Infinity)-s.start;
  if(s.mode==='exam'){
    s.items.forEach(it=>{it.ok=it.sel.length?isOk(it):false;it.done=true;record(it.id,it.ok)});
  }
  S.cycles++;
  const correct=s.items.filter(x=>x.ok).length;
  S.history.push({t:Date.now(),mode:s.mode,total:s.items.length,correct});
  if(S.history.length>200)S.history.shift();
  save();view='result';render();
}

function reviewHtml(items,onlyWrong){
  const list=items.map((it,i)=>({it,i})).filter(x=>!onlyWrong||!x.it.ok);
  if(!list.length)return '<div class="muted">Ошибок нет.</div>';
  return list.map(({it,i})=>{
    const q=BY[it.id];const picked=it.sel.map(p=>it.order[p]);
    return `<div class="review"><b>${i+1}. ${esc(q.q)}</b>
      ${picked.length?picked.filter(o=>!q.c.includes(o)).map(o=>`<div class="a r">✗ Ваш ответ: ${esc(q.o[o])}</div>`).join(''):'<div class="a r">✗ Нет ответа</div>'}
      ${q.c.map(o=>`<div class="a g">✓ ${esc(q.o[o])}</div>`).join('')}${CARD[it.id]?`<div class="a" style="color:var(--warn)">💡 ${esc(CARD[it.id].m)}</div>`:''}</div>`;
  }).join('');
}
function renderResult(){
  const s=sess(),exam=s.mode==='exam';
  const correct=s.items.filter(x=>x.ok).length,errs=s.items.length-correct;
  const pass=errs<=EXAM_MAX_ERR;
  app.innerHTML=`
  <h1>${exam?'Результат экзамена':'Цикл завершён'}</h1>
  <div class="card">
    ${exam?`<div class="res ${pass?'ok':'bad'}">${pass?'СДАНО':'НЕ СДАНО'}</div>`:`<div class="res">${correct} из ${s.items.length}</div>`}
    <div>Ошибок: <b>${errs}</b>${exam?` (допустимо ${EXAM_MAX_ERR})`:''} · правильных: ${correct} · время: ${fmt(s.spent)}${s.timeout?' (время вышло)':''}</div>
    <div class="row"><button class="primary" id="again">${exam?'Новый экзамен':'Следующий цикл'}</button><button id="home">В меню</button><button id="stats">Статистика</button></div>
  </div>
  <div class="card"><h2>Разбор ошибок</h2>${reviewHtml(s.items,true)}</div>
  ${!exam&&correct===s.items.length?'':''}`;
  $('#again').onclick=()=>{view='quiz';startSession(s.mode)};
  $('#home').onclick=()=>{S.session=null;save();go('home')};
  $('#stats').onclick=()=>go('stats');
}

function renderStats(){
  const t=totals();
  const rows=Q.map((q,i)=>{const s=S.stats[q.id]||{seen:0,wrong:0,streak:0};return {q,i,s,rate:s.seen?s.wrong/s.seen:-1}})
    .filter(r=>r.s.seen).sort((a,b)=>b.s.wrong-a.s.wrong||b.rate-a.rate).slice(0,30);
  const hist=S.history.slice(-10).reverse();
  app.innerHTML=`
  <h1>Статистика</h1>
  <div class="card">
    <div>Вопросов пройдено: <b>${t.seen}</b> из ${Q.length} · циклов: <b>${S.cycles}</b></div>
    <div>Ответов всего: <b>${t.att}</b> · точность: <b>${pct(t.att-t.wr,t.att)}%</b> · выучено (3 верных подряд): <b>${t.mastered}</b></div>
    <div class="bar"><i style="width:${pct(t.mastered,Q.length)}%"></i></div>
  </div>
  <div class="card"><h2>Последние циклы</h2>
  ${hist.length?`<table><tr><th>Дата</th><th>Режим</th><th>Результат</th></tr>${hist.map(h=>{
    const er=h.total-h.correct;const d=new Date(h.t).toLocaleString('ru-RU',{dateStyle:'short',timeStyle:'short'});
    return `<tr><td class="n">${d}</td><td>${h.mode==='exam'?'Экзамен':'Тренировка'}</td><td>${h.correct}/${h.total}${h.mode==='exam'?(er<=EXAM_MAX_ERR?' — сдано':' — не сдано'):''}</td></tr>`}).join('')}</table>`:'<div class="muted">Пока пусто.</div>'}
  </div>
  <div class="card"><h2>Самые проблемные вопросы</h2>
  ${rows.some(r=>r.s.wrong)?`<table><tr><th>№</th><th>Вопрос</th><th>Ошибок</th></tr>${rows.filter(r=>r.s.wrong).map(r=>`<tr><td class="n">${r.i+1}</td><td>${esc(r.q.q.replace(/ Выберите.*$/,''))}</td><td class="n">${r.s.wrong} из ${r.s.seen}</td></tr>`).join('')}</table>`:'<div class="muted">Ошибок пока нет.</div>'}
  </div>
  <div class="card"><h2>Данные</h2>
    <div class="small muted">Статистика хранится в браузере. Сделайте экспорт, чтобы не потерять её при очистке данных или переносе на другое устройство.</div>
    <div class="row"><button id="exp">Скопировать копию</button><button id="imp">Восстановить из текста</button><button class="danger" id="reset">Сбросить</button></div>
    <textarea class="bk" id="bk" placeholder="Здесь появится резервная копия. Чтобы перенести прогресс на другое устройство, вставьте сюда текст копии и нажмите «Восстановить»."></textarea>
    <div class="msg muted" id="bmsg"></div>
  </div>
  <div class="row"><button id="home">← В меню</button></div>`;
  $('#home').onclick=()=>go('home');
  const bk=$('#bk'),say=x=>{$('#bmsg').textContent=x};
  $('#exp').onclick=()=>{
    bk.value=JSON.stringify({stats:S.stats,cycles:S.cycles,history:S.history,cards:S.cards});
    bk.select();
    try{navigator.clipboard.writeText(bk.value).then(()=>say('Скопировано. Сохраните текст в заметках.'),()=>say('Выделено. Скопируйте текст вручную.'))}catch(_){say('Выделено. Скопируйте текст вручную.')}
  };
  $('#imp').onclick=()=>{
    try{const d=JSON.parse(bk.value);if(!d.stats)throw 0;
      ask('Заменить текущий прогресс данными из копии?',()=>{S.stats=d.stats;S.cycles=d.cycles||0;S.history=d.history||[];S.cards=d.cards||{};S.session=null;save();renderStats()})}
    catch(_){say('Не удалось прочитать текст копии.')}
  };
  $('#reset').onclick=()=>ask('Удалить всю статистику и прогресс карточек?',()=>{S.stats={};S.cycles=0;S.history=[];S.cards={};S.session=null;save();renderStats()});
}


/* ---------- обучение: карточки ---------- */
let L=null;
function renderLearnHome(){
  const rows=Object.keys(TOPICS).map(k=>{
    const qs=Q.filter((q,i)=>CARDS[i].t===k);
    const m=qs.filter(q=>S.cards[q.id]&&S.cards[q.id].box>=3).length;
    return `<button class="topic" data-t="${k}"><span class="nm">${TOPICS[k][0]} ${TOPICS[k][1]}</span>
      <span class="muted small"> · ${m} из ${qs.length} выучено</span><div class="bar"><i style="width:${pct(m,qs.length)}%;background:var(--warn)"></i></div></button>`;
  }).join('');
  const weak=Q.filter(q=>S.cards[q.id]&&S.cards[q.id].box===0&&S.stats[q.id]&&S.stats[q.id].wrong).length;
  app.innerHTML=`<h1>🧠 Карточки</h1>
  <div class="muted small">Сначала вспомни ответ, потом переверни. «Не помню» вернёт карточку скоро и будет показывать её чаще.</div>
  <div class="card"><div class="big">🎯</div>
    <b>Умный набор</b> <span class="muted small">— 15 карточек: новые, слабые и те, где вы чаще ошибаетесь в тестах${weak?` (сейчас слабых: ${weak})`:''}</span>
    <div class="row"><button class="primary" id="smart">Начать</button><button id="cheat">Шпаргалка</button><button id="home">← В меню</button></div></div>
  <h2 style="margin-top:18px">По темам</h2>${rows}`;
  $('#smart').onclick=()=>startLearn(null);
  $('#cheat').onclick=()=>go('cheat');
  $('#home').onclick=()=>go('home');
  app.querySelectorAll('.topic').forEach(b=>b.onclick=()=>startLearn(b.dataset.t));
}
function startLearn(topic){
  const pool=Q.filter((q,i)=>!topic||CARDS[i].t===topic);
  const n=topic?Math.min(20,pool.length):15;
  const ids=shuffle(pickCards(pool,n)).map(q=>q.id);
  L={topic,queue:ids,total:ids.length,flip:false,known:0,again:0,seen:new Set()};
  view='learn';render();
}
function renderLearn(){
  if(!L){view='learnhome';return renderLearnHome()}
  if(!L.queue.length){
    app.innerHTML=`<h1>Сессия завершена</h1><div class="card"><div class="big">🎉</div>
      <p>Карточек: <b>${L.total}</b> · ответов «знаю»: <b>${L.known}</b> · «не помню»: <b>${L.again}</b></p>
      <p class="muted small">Дальше — тренировка: проверьте, что ответы держатся в голове.</p>
      <div class="row"><button class="primary" id="more">Ещё набор</button><button id="train">К тренировке</button><button id="home">В меню</button></div></div>`;
    $('#more').onclick=()=>startLearn(L.topic);
    $('#train').onclick=()=>{view='quiz';startSession('train')};
    $('#home').onclick=()=>{L=null;go('home')};
    return;
  }
  const id=L.queue[0],c=CARD[id],tp=TOPICS[c.t],done=L.total-new Set(L.queue).size;
  const box=(S.cards[id]||{box:0}).box;
  app.innerHTML=`<div class="top"><div><b>Карточки</b> · осталось ${L.queue.length}</div><span class="muted small">Уровень: ${'●'.repeat(box)+'○'.repeat(4-box)}</span></div>
  <div class="bar"><i style="width:${pct(done,L.total)}%"></i></div>
  <div class="card flash"><div><span class="chip">${tp[0]} ${tp[1]}</span>
    <div class="fq">${esc(c.q)}?</div>
    ${L.flip?`<div class="fa">✔ ${esc(c.a)}</div><div class="meme">${esc(c.m)}</div>`:'<div class="muted">Вспомни ответ вслух, потом переверни.</div>'}</div>
    <div class="row">${L.flip?`<button class="danger" id="no" style="flex:1">😵 Не помню</button><button class="primary" id="yes" style="flex:1">😎 Знаю</button>`
      :`<button class="primary" id="show" style="flex:1">Показать ответ</button>`}</div></div>
  <div class="row"><button id="back">Выйти</button><span class="muted small" style="align-self:center">Пробел — ответ · 1 / 2 — не помню / знаю</span></div>`;
  if(L.flip){$('#no').onclick=()=>answerLearn(false);$('#yes').onclick=()=>answerLearn(true)}
  else $('#show').onclick=()=>{L.flip=true;renderLearn()};
  $('#back').onclick=()=>{L=null;go('learnhome')};
}
function answerLearn(known){
  const id=L.queue.shift(),cs=cst(id);
  cs.n++;
  if(known){
    if(!L.seen.has(id)){cs.box=Math.min(4,cs.box+1)}   // повтор после «не помню» уровень не повышает
    L.known++;
  }else{
    cs.box=0;L.again++;L.seen.add(id);
    L.queue.splice(Math.min(3,L.queue.length),0,id);
  }
  L.flip=false;save();renderLearn();
}

/* ---------- шпаргалка ---------- */
let cheatTab='nums',cheatQ='';
function renderCheat(){
  const tabs=[['nums','🔢 Числа'],['who','🏛️ Кто что'],['tips','💡 Приёмы'],['all','📚 Все карточки']];
  app.innerHTML=`<h1>Шпаргалка</h1>
  <div class="tabs">${tabs.map(([k,n])=>`<button data-k="${k}" class="${k===cheatTab?'on':''}">${n}</button>`).join('')}</div>
  <div id="cbody"></div>
  <div class="row"><button id="home">← В меню</button><button id="learn">Карточки</button></div>`;
  app.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{cheatTab=b.dataset.k;renderCheat()});
  $('#home').onclick=()=>go('home');$('#learn').onclick=()=>go('learnhome');
  const body=$('#cbody');
  if(cheatTab==='nums'){
    body.innerHTML=NUMS.map(([g,rows])=>`<div class="card"><div class="numgrp">${g}</div><table>${rows.map(r=>
      `<tr><td class="n"><b>${esc(r[0])}</b></td><td>${esc(r[1])}<div class="muted small">💡 ${esc(r[2])}</div></td></tr>`).join('')}</table></div>`).join('');
  }else if(cheatTab==='who'){
    body.innerHTML=`<div class="card"><table class="who">${WHO.map(r=>`<tr><td>${r[0]}</td><td>${esc(r[1])}</td></tr>`).join('')}</table></div>`;
  }else if(cheatTab==='tips'){
    body.innerHTML=TIPS.map(r=>`<div class="card"><b>${r[0]} ${esc(r[1])}</b><div style="margin-top:4px">${esc(r[2])}</div></div>`).join('');
  }else{
    body.innerHTML=`<input class="search" id="sq" placeholder="Поиск по вопросам, ответам и подсказкам" value="${esc(cheatQ)}"><div id="clist"></div>`;
    const draw=()=>{
      const f=cheatQ.trim().toLowerCase();
      const list=CARDS.filter(c=>!f||(c.q+' '+c.a+' '+c.m).toLowerCase().includes(f));
      let h='',cur='';
      for(const c of list){
        if(c.t!==cur){cur=c.t;h+=`<div class="numgrp" style="margin-top:14px">${TOPICS[c.t][0]} ${TOPICS[c.t][1]}</div>`}
        h+=`<div class="cardrow"><div class="qq">${c.i+1}. ${esc(c.q)}</div><div class="aa">${esc(c.a)}</div><div class="mm">${esc(c.m)}</div></div>`;
      }
      $('#clist').innerHTML=h||'<div class="muted">Ничего не найдено.</div>';
    };
    $('#sq').oninput=e=>{cheatQ=e.target.value;draw()};
    draw();
  }
}

document.addEventListener('keydown',e=>{
  if(view==='learn'&&L&&L.queue.length){
    if(e.key===' '||e.key==='Enter'){e.preventDefault();if(!L.flip){L.flip=true;renderLearn()}}
    else if(L.flip&&(e.key==='1'||e.key==='ArrowLeft')){answerLearn(false)}
    else if(L.flip&&(e.key==='2'||e.key==='ArrowRight')){answerLearn(true)}
    return;
  }
  if(view!=='quiz'||!sess()||sess().finished)return;
  if(e.key>='1'&&e.key<='9'){const b=document.querySelectorAll('.opt')[+e.key-1];if(b)b.click()}
  else if(e.key==='Enter'){const b=$('#submit')||$('#nextq');if(b&&!b.disabled)b.click()}
});

// возобновление незавершённой сессии
if(S.session&&!S.session.finished){view='home'}
else if(S.session&&S.session.finished){S.session=null}
render();
</script>

</body></html>
